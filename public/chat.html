<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chats · Hexalog WhatsApp Listener</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hexalog.css">
<style>
  html, body { height:100%; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  .bar nav .me { margin-left:8px; }
  .banner { background:#fff4d6; color:#5c3d00; padding:8px 16px; font-size:14px; text-align:center; border-bottom:1px solid #f0d78a; }
  .banner a { color:inherit; font-weight:700; }
  .app { flex:1; min-height:0; display:flex; width:100%; max-width:1500px; margin:0 auto; background:var(--card); border-left:1px solid var(--line); border-right:1px solid var(--line); }
  input, select, textarea { font:inherit; padding:9px 11px; border:1.5px solid var(--line); border-radius:12px; background:transparent; color:var(--text); width:100%; }
  select option { color:#1c0f45; }
  button.sm { padding:6px 12px; font-size:13px; }
  /* left: chats */
  .side { width:370px; flex:none; display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  .side-top { padding:10px 12px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
  .tabs { display:flex; gap:4px; } .tabs button { flex:1; padding:7px 4px; font-size:13px; border-radius:10px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .row2 { display:flex; gap:8px; }
  .glist { flex:1; overflow-y:auto; }
  .g { display:flex; gap:11px; padding:11px 12px; cursor:pointer; border-bottom:1px solid var(--line); align-items:center; }
  .g:hover { background:var(--lav-100); } .g.on { background:var(--lav-200); }
  .av { width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:15px; }
  .g .mid { flex:1; min-width:0; } .g .name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:6px; align-items:center; }
  .g .prev { font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g .right { text-align:right; flex:none; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .sub { font-size:12px; color:var(--muted); }
  .badge { background:var(--accent); color:#fff; font-size:12px; font-weight:700; border-radius:999px; padding:1px 8px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }
  .s-open { background:#3b82f6; } .s-pending { background:#e0a03a; } .s-resolved { background:#4cc38a; }
  .wait { font-size:11px; font-weight:700; color:#b26a00; } .wait.late { color:#c0362c; }
  .chip { font-size:11px; font-weight:600; background:var(--lav-200); color:var(--accent); border-radius:999px; padding:1px 8px; white-space:nowrap; }
  .chip.me { background:var(--accent); color:#fff; }
  /* right */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--lav-100); }
  .head { background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
  .head .l1 { display:flex; align-items:center; gap:10px; }
  .head .t { font-weight:800; font-size:17px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .head .l2 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .head select { width:auto; padding:6px 10px; font-size:13px; }
  .labels { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
  .labels .chip button { all:unset; cursor:pointer; margin-left:4px; opacity:.7; }
  .labels input { width:110px; padding:4px 8px; font-size:12px; border-radius:999px; }
  .body { flex:1; min-height:0; display:flex; }
  .conv { flex:1; min-width:0; display:flex; flex-direction:column; }
  .msgs { flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:6px; }
  .empty { margin:auto; color:var(--muted); text-align:center; }
  .day { align-self:center; font-size:12px; font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px 12px; margin:10px 0 4px; }
  .b { max-width:min(640px,84%); padding:7px 12px 5px; border-radius:14px; background:var(--card); border:1px solid var(--line); align-self:flex-start; position:relative; word-wrap:break-word; }
  .b.me { align-self:flex-end; background:var(--lav-200); }
  .b .who { font-size:12.5px; font-weight:700; margin-bottom:2px; }
  .b .txt { white-space:pre-wrap; } .b .txt.del { opacity:.55; text-decoration:line-through; }
  .b .meta { font-size:11px; color:var(--muted); text-align:right; margin-top:2px; }
  .b .acts { position:absolute; top:-12px; right:8px; display:none; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:2px; z-index:2; }
  .b:hover .acts { display:flex; } .acts button { all:unset; cursor:pointer; font-size:13px; padding:2px 7px; border-radius:7px; } .acts button:hover { background:var(--lav-200); }
  .rx { display:flex; gap:4px; margin-top:3px; flex-wrap:wrap; } .rx span { font-size:12px; background:var(--lav-100); border:1px solid var(--line); border-radius:999px; padding:0 7px; }
  .picker { position:absolute; top:-44px; right:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 6px; display:flex; gap:4px; z-index:3; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  .picker button { all:unset; cursor:pointer; font-size:20px; padding:2px 4px; }
  .q { border-left:4px solid var(--accent); background:rgba(124,77,255,.1); border-radius:6px; padding:4px 8px; margin-bottom:4px; font-size:13px; color:var(--muted); }
  .b img, .b video { max-width:100%; max-height:340px; border-radius:10px; display:block; margin-bottom:4px; }
  .b audio { width:260px; max-width:100%; display:block; margin-bottom:4px; }
  .more { align-self:center; font-size:13px; padding:6px 14px; }
  /* composer */
  .composer { background:var(--card); border-top:1px solid var(--line); padding:10px 14px; display:flex; flex-direction:column; gap:8px; position:relative; }
  .composer .row { display:flex; gap:8px; align-items:flex-end; } .composer textarea { resize:none; height:44px; max-height:140px; }
  .composer select { width:auto; } .tool { padding:9px 12px; font-size:16px; }
  .bar2 { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); border-left:4px solid var(--accent); padding-left:8px; }
  .bar2 span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .err { color:var(--danger); font-size:13px; min-height:16px; }
  .quick { position:absolute; bottom:100%; left:14px; width:min(440px,92vw); max-height:340px; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.18); padding:10px; display:flex; flex-direction:column; gap:6px; z-index:5; }
  .quick .it { padding:8px 10px; border-radius:10px; cursor:pointer; border:1px solid var(--line); } .quick .it:hover { background:var(--lav-200); }
  .quick .it b { display:block; font-size:14px; } .quick .it span { font-size:13px; color:var(--muted); }
  /* notes panel */
  .panel { width:320px; flex:none; border-left:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; min-height:0; }
  .panel h4 { margin:0; padding:12px 14px; border-bottom:1px solid var(--line); font-size:15px; display:flex; justify-content:space-between; align-items:center; }
  .notes { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .note { background:#fff8e1; color:#4a3a00; border:1px solid #f0d78a; border-radius:10px; padding:7px 10px; font-size:14px; white-space:pre-wrap; }
  .note .by { font-size:11px; color:#8a6d00; display:block; margin-bottom:2px; } .note button { all:unset; cursor:pointer; float:right; font-size:12px; color:#8a6d00; }
  .ev { font-size:12px; color:var(--muted); text-align:center; }
  .panel .add { padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  /* dialogs */
  .modal { position:fixed; inset:0; background:rgba(20,10,51,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal .card { max-width:520px; width:100%; margin:0; max-height:90vh; overflow:auto; }
  .stat { display:flex; gap:12px; flex-wrap:wrap; margin:10px 0; } .stat div { flex:1; min-width:120px; background:var(--lav-100); border-radius:14px; padding:12px; } .stat b { display:block; font-size:24px; }
  table.t { width:100%; border-collapse:collapse; font-size:14px; } table.t td, table.t th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; }
  .av.grp { border-radius:14px; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1c0f45; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:90; max-width:90vw; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .offline { background:#fde8e6; color:#7a1c14; padding:6px 16px; font-size:13px; text-align:center; border-bottom:1px solid #f3b9b3; }
  .newbtns { display:flex; gap:8px; } .newbtns button { flex:1; }
  .tabs2 { display:flex; gap:6px; } .tabs2 button { padding:4px 12px; font-size:13px; border-radius:999px; } .tabs2 button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pane { flex:1; overflow-y:auto; min-height:0; display:flex; flex-direction:column; }
  .mem { display:flex; align-items:center; gap:8px; padding:7px 12px; border-bottom:1px solid var(--line); font-size:14px; } .mem .who { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .frm { display:flex; flex-direction:column; gap:10px; margin-top:12px; } .frm label { font-size:13px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px; }
  .hint { font-size:12px; color:var(--muted); }
  .skel { align-self:center; margin:auto; color:var(--muted); }
  .back { display:none; }
  @media (max-width:980px) { .panel { position:absolute; right:0; top:0; bottom:0; z-index:20; box-shadow:-8px 0 24px rgba(0,0,0,.2); } .body { position:relative; } }
  @media (max-width:820px) {
    .side { width:100%; border-right:none; } .main { display:none; }
    .app.chat .side { display:none; } .app.chat .main { display:flex; } .back { display:inline-block; }
  }
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><a class="logo" href="/"><img src="/hexalog-logo.webp" alt="Hexalog" onerror="this.remove()"><span class="wm">HEXALOG</span></a>
  <nav><a class="on" href="/chat">Chats</a><a id="navPortal" href="/" hidden>Portal</a><a href="/docs">API docs</a><a href="#" id="meBtn" class="me"></a></nav></div></header>
<div class="banner" id="banner" hidden></div>
<div class="offline" id="offline" hidden>Connection lost. Trying to reconnect&hellip; new messages may be delayed.</div>

<div class="app" id="app">
  <aside class="side">
    <div class="side-top">
      <div class="newbtns" id="newbtns"><button class="sm primary" id="newChat">+ New chat</button><button class="sm" id="newGroup">+ New group</button></div>
      <div class="tabs" id="tabs"></div>
      <input id="gsearch" placeholder="Search chats or labels" autocomplete="off">
      <div class="row2"><select id="kfilter" title="Type"><option value="all">All types</option><option value="group">Groups</option><option value="dm">Direct</option></select><select id="sfilter"><option value="active">Not resolved</option><option value="resolved">Resolved</option><option value="all">Any status</option></select><select id="nfilter" hidden></select></div>
    </div>
    <div class="glist" id="glist"></div>
  </aside>
  <section class="main">
    <div class="head" id="head" hidden>
      <div class="l1"><button class="back sm" id="back">‹ Back</button><div class="t"><span id="title"></span><span class="sub" id="subtitle" style="font-weight:400;margin-left:8px"></span></div>
        <input id="msearch" placeholder="Search in chat" style="width:170px"><button class="sm" id="infoBtn">Info</button><button class="sm" id="notesBtn">Notes</button></div>
      <div class="l2"><select id="status" title="Status"><option value="open">Open</option><option value="pending">Pending</option><option value="resolved">Resolved</option></select>
        <select id="assignee" title="Owner"></select><div class="labels" id="labels"></div></div>
    </div>
    <div class="body">
      <div class="conv">
        <div class="msgs" id="msgs"><div class="empty">Pick a chat on the left to read it.</div></div>
        <div class="composer" id="composer" hidden>
          <div class="quick" id="quick" hidden></div>
          <div class="bar2" id="replybar" hidden><span id="replytext"></span><button class="sm" id="replyx">×</button></div>
          <div class="bar2" id="filebar" hidden><span id="filetext"></span><button class="sm" id="filex">×</button></div>
          <div class="row">
            <button class="tool" id="attachBtn" title="Attach a file">📎</button><input type="file" id="file" hidden>
            <button class="tool" id="quickBtn" title="Quick replies">⚡</button>
            <select id="sendas" hidden title="Send from which number"></select>
            <textarea id="text" rows="1" placeholder="Type a reply (Enter to send, Shift+Enter for a new line)"></textarea>
            <button class="primary" id="send">Send</button>
          </div>
          <div class="err" id="err"></div>
        </div>
      </div>
      <aside class="panel" id="panel" hidden>
        <h4><span class="tabs2"><button id="tabNotes" class="on">Notes</button><button id="tabInfo">Info</button></span> <button class="sm" id="panelx">×</button></h4>
        <div class="pane" id="notesPane">
          <div class="muted" style="padding:8px 14px 0;font-size:12px">Only your team sees these. They are never sent to WhatsApp.</div>
          <div class="notes" id="notes"></div>
          <div class="add"><textarea id="noteText" rows="2" placeholder="Write a note for the team"></textarea><button class="primary sm" id="noteAdd">Add note</button></div>
        </div>
        <div class="pane" id="infoPane" hidden></div>
      </aside>
    </div>
  </section>
</div>
<div id="modal"></div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['#5b24d6', '#168a52', '#b26a00', '#c0362c', '#0a7ea4', '#a02c8c', '#6b6290', '#2f6f4f'];
const S = {
  me: null, writes: true, chats: [], users: [], numbers: [], quick: [], cur: null, msgs: [], hasMore: false, searching: false, loading: false, loadErr: '',
  notes: [], tab: 'all', status: 'active', kind: 'all', nf: '', q: '', replyTo: null, attach: null, panel: false, panelTab: 'notes',
  drafts: {}, openTok: 0, stick: true, live: false, sending: false,
};
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ---------- small helpers
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const color = (s) => COLORS[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const initials = (s) => (String(s).match(/[A-Za-z0-9]/g) || ['#']).slice(0, 2).join('').toUpperCase();
const hm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayLabel = (t) => { const d = new Date(t), n = new Date(), y = new Date(n); y.setDate(n.getDate() - 1); const same = (a, b) => a.toDateString() === b.toDateString();
  return same(d, n) ? 'Today' : same(d, y) ? 'Yesterday' : d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }); };
const shortTime = (t) => { if (!t) return ''; const d = new Date(t); return d.toDateString() === new Date().toDateString() ? hm(t) : d.toLocaleDateString([], { day: 'numeric', month: 'short' }); };
const mins = (m) => (m == null ? '–' : m < 60 ? Math.round(m) + 'm' : m < 1440 ? Math.floor(m / 60) + 'h ' + Math.round(m % 60) + 'm' : Math.floor(m / 1440) + 'd');
const ago = (t) => (Date.now() - new Date(t).getTime()) / 60000;
const nameOf = (c) => c.subject || (c.phone ? '+' + c.phone : c.jid);
const preview = (c) => { if (!c.last_ts) return 'No messages yet'; const body = c.last_deleted ? 'deleted message' : (c.last_text || '[' + (c.last_type || 'message') + ']'); return (c.last_from_me ? 'You: ' : c.is_group && c.last_sender ? c.last_sender + ': ' : '') + body; };
const canWrite = () => S.writes;
const numLabel = (id) => S.numbers.find((n) => n.id === id)?.label || ('#' + id);

let toastTimer;
function toast(msg) {
  let t = document.querySelector('.toast'); if (!t) { t = h('div', 'toast'); document.body.append(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 5000);
}
window.addEventListener('unhandledrejection', (e) => { e.preventDefault(); const m = e.reason && e.reason.message; if (m && !/login required/.test(m)) toast(m); });
window.addEventListener('error', (e) => { console.error(e.error || e.message); });

async function api(path, opts = {}) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), opts.timeout || 30000);
  let r;
  try { r = await fetch(path, { method: opts.method || 'GET', headers: opts.body ? { 'content-type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined, signal: ctl.signal }); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'The server took too long to answer. Try again.' : 'Could not reach the server. Check your connection.'); }
  finally { clearTimeout(timer); }
  if (r.status === 401) { location.href = '/'; throw new Error('login required'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('Something went wrong (HTTP ' + r.status + ')'));
  return j;
}

/** Make `box` hold exactly `nodes`, in order, touching only what changed (so playing audio, loaded images and scroll positions survive). */
function reconcile(box, nodes) {
  let ref = box.firstChild;
  for (const n of nodes) { if (n === ref) ref = ref.nextSibling; else box.insertBefore(n, ref); }
  while (ref) { const nx = ref.nextSibling; ref.remove(); ref = nx; }
}

// ---------- sound + desktop alerts
let actx;
function beep() { try { actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination); o.frequency.value = 880; g.gain.value = 0.05; o.start(); o.stop(actx.currentTime + 0.12); } catch {} }
const alertsOn = () => lsGet('alerts') === '1' && 'Notification' in window && Notification.permission === 'granted';
function notify(chat, m) {
  if (!alertsOn()) return;
  if (document.visibilityState === 'visible' && S.cur && S.cur.jid === m.chat_jid) return;
  beep();
  try { const n = new Notification(chat ? nameOf(chat) : 'New message', { body: (m.sender_name || '') + (m.sender_name ? ': ' : '') + (m.text || '[' + m.type + ']'), tag: m.chat_jid }); n.onclick = () => { window.focus(); openChat(m.chat_jid); n.close(); }; } catch {}
}
function updateTitle() { const n = S.chats.reduce((a, c) => a + (c.unread || 0), 0); document.title = (n ? '(' + n + ') ' : '') + 'Chats · Hexalog WhatsApp Listener'; }

// ---------- chat list
let loadSeq = 0, loadTimer = null;
function scheduleChats(ms = 350) { clearTimeout(loadTimer); loadTimer = setTimeout(() => loadChats().catch(() => {}), ms); }
async function loadChats() {
  const seq = ++loadSeq;
  const j = await api('/portal/chat/chats' + (S.nf ? '?number=' + encodeURIComponent(S.nf) : ''));
  if (seq !== loadSeq) return;                       // a newer request is already on its way
  const stubs = S.chats.filter((c) => c.stub && !j.chats.some((x) => x.jid === c.jid));
  S.chats = j.chats.concat(stubs);
  if (S.cur) {
    const fresh = S.chats.find((c) => c.jid === S.cur.jid);
    if (fresh) { const changed = stateSig(fresh) !== stateSig(S.cur); S.cur = fresh; if (changed) fillHead(); if (fresh.unread) markRead(); }
  }
  renderTabs(); renderChats();
}
const stateSig = (c) => JSON.stringify([c.status, c.assignee_id, c.labels, c.subject]);
const sortChats = () => S.chats.sort((a, b) => new Date(b.last_ts || b.stub_ts || 0) - new Date(a.last_ts || a.stub_ts || 0));
function visible(c) {
  if (S.kind === 'group' && !c.is_group) return false;
  if (S.kind === 'dm' && c.is_group) return false;
  if (S.status === 'active' && c.status === 'resolved') return false;
  if (S.status === 'resolved' && c.status !== 'resolved') return false;
  if (S.tab === 'mine' && c.assignee_id !== S.me.id) return false;
  if (S.tab === 'unassigned' && c.assignee_id) return false;
  if (S.tab === 'waiting' && !(c.waiting_since && c.status !== 'resolved')) return false;
  const f = S.q.toLowerCase();
  if (f && !(nameOf(c).toLowerCase().includes(f) || (c.phone || '').includes(f.replace(/\D/g, '') || '\u0000') || c.labels.some((l) => l.toLowerCase().includes(f)))) return false;
  return true;
}
function renderTabs() {
  const live = S.chats.filter((c) => c.status !== 'resolved');
  const count = { waiting: live.filter((c) => c.waiting_since).length, mine: live.filter((c) => c.assignee_id === S.me.id).length, unassigned: live.filter((c) => !c.assignee_id).length };

  const rn = h('button', 'sm', 'Rename group'); rn.disabled = !canWrite();
  rn.onclick = async () => { const v = name.value.trim(); if (!v || v === g.subject) return; rn.disabled = true; try { await api(`/portal/chat/groups/${encodeURIComponent(jid)}/subject`, { method: 'PUT', body: { subject: v } }); toast('Group renamed.'); scheduleChats(800); loadInfo().catch(() => {}); } catch (e) { toast(e.message); rn.disabled = false; } };
  top.append(h('label', 'hint', 'Group name'), name, rn); box.append(top);
  box.append(Object.assign(h('div', 'hint', g.participants.length + ' members'), { style: 'padding:10px 12px 4px' }));
  for (const p of g.participants) {
    const r = h('div', 'mem'); const w = h('div', 'who', p.name ? p.name + (p.phone ? ' · +' + p.phone : '') : (p.phone ? '+' + p.phone : p.jid)); r.append(w);
    if (p.admin) r.append(h('span', 'chip', 'admin'));
    if (canWrite()) { const x = h('button', 'sm', 'Remove'); x.onclick = async () => { if (!confirm('Remove ' + (p.name || '+' + p.phone) + ' from this group?')) return; x.disabled = true; try { const o = await api(`/portal/chat/groups/${encodeURIComponent(jid)}/participants`, { method: 'POST', body: { action: 'remove', participants: [p.jid] } }); if (o.results && o.results[0] && !o.results[0].ok) toast('Could not remove: ' + o.results[0].reason); loadInfo().catch(() => {}); } catch (e) { toast(e.message); x.disabled = false; } }; r.append(x); }
    box.append(r);
  }
  if (canWrite()) {
    const add = h('div'); add.style.cssText = 'padding:12px;display:flex;flex-direction:column;gap:6px';
    const ta = h('textarea'); ta.rows = 3; ta.placeholder = 'Add people: one phone number per line, with country code';
    const b = h('button', 'primary sm', 'Add to group');
    b.onclick = async () => { const nums = ta.value.split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean); if (!nums.length) return; b.disabled = true;
      try { const o = await api(`/portal/chat/groups/${encodeURIComponent(jid)}/participants`, { method: 'POST', body: { action: 'add', participants: nums } }); const bad = (o.results || []).filter((r) => !r.ok); toast(bad.length ? bad.length + ' could not be added: ' + bad.map((r) => r.reason).join(', ') : 'Added.'); ta.value = ''; loadInfo().catch(() => {}); }
      catch (e) { toast(e.message); } b.disabled = false; };
    add.append(h('label', 'hint', 'Add people'), ta, b); box.append(add);
  }
}

// ---------- new chat / new group
function closeModal() { $('modal').replaceChildren(); }
function modal(title, build) {
  closeModal();
  const m = h('div', 'modal'), c = h('div', 'card'); const hd = h('div'); hd.style.cssText = 'display:flex;justify-content:space-between;align-items:center'; hd.append(h('h3', '', title)); const x = h('button', 'sm', 'Close'); x.onclick = closeModal; hd.append(x);
  c.append(hd); build(c); m.append(c); m.onclick = (e) => { if (e.target === m) closeModal(); }; $('modal').append(m);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
function numberPicker(c) {
  const open = S.numbers.filter((n) => n.state === 'open'); if (open.length < 2) return () => (open[0] ? String(open[0].id) : undefined);
  const wrap = h('div'); wrap.append(h('label', '', 'Use which WhatsApp number?')); const sel = h('select'); open.forEach((n) => sel.append(new Option(n.label, String(n.id)))); wrap.append(sel); c.append(wrap); return () => sel.value;
}
$('newChat').onclick = () => modal('New chat', (c) => {
  const f = h('div', 'frm'); const wrap = h('div'); wrap.append(h('label', '', 'Phone number, with country code'));
  const ph = h('input'); ph.placeholder = 'e.g. 919800000001'; ph.inputMode = 'tel'; ph.autocomplete = 'off'; wrap.append(ph); f.append(wrap);
  c.append(f); const pick = numberPicker(f); const err = h('div', 'err'); const go = h('button', 'primary', 'Start chat'); f.append(go, err, h('div', 'hint', 'We check that the number is on WhatsApp first.'));
  const run = async () => {
    err.textContent = ''; go.disabled = true;
    try {
      const r = await api('/portal/chat/lookup', { method: 'POST', body: { phone: ph.value, number: pick() } });
      closeModal();
      const stub = { jid: r.jid, is_group: false, subject: null, phone: r.phone, numbers: [r.number], useNumber: String(r.number), labels: [], status: 'open', stub: true, stub_ts: new Date().toISOString() };
      const had = S.chats.find((x) => x.jid === r.jid); if (had) had.useNumber = String(r.number);
      await openChat(r.jid, stub); $('text').focus();
    } catch (e) { err.textContent = e.message; go.disabled = false; }
  };
  go.onclick = run; ph.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); }); setTimeout(() => ph.focus(), 50);
});
$('newGroup').onclick = () => modal('New group', (c) => {
  const f = h('div', 'frm'); c.append(f);
  const w1 = h('div'); w1.append(h('label', '', 'Group name')); const nm = h('input'); nm.maxLength = 100; nm.placeholder = 'e.g. Acme - CX'; w1.append(nm);
  const w2 = h('div'); w2.append(h('label', '', 'People to add')); const ta = h('textarea'); ta.rows = 5; ta.placeholder = 'One phone number per line, with country code\n919800000001\n919800000002'; w2.append(ta);
  f.append(w1, w2); const pick = numberPicker(f); const err = h('div', 'err'); const go = h('button', 'primary', 'Create group');
  f.append(go, err, h('div', 'hint', 'Everyone must be on WhatsApp. The linked number becomes the group admin. WhatsApp limits how fast groups can be created, so create only what you need.'));
  go.onclick = async () => {
    err.textContent = ''; go.disabled = true; go.textContent = 'Creating…';
    try {
      const r = await api('/portal/chat/groups', { method: 'POST', body: { subject: nm.value, participants: ta.value.split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean), number: pick() }, timeout: 60000 });
      closeModal(); await loadChats().catch(() => {}); await openChat(r.jid); toast('Group created.');
    } catch (e) { err.textContent = e.message; go.disabled = false; go.textContent = 'Create group'; }
  };
  setTimeout(() => nm.focus(), 50);
});

// ---------- live updates
const streams = {};
function setLive(ok) {
  S.live = ok; clearTimeout(setLive.t);
  if (ok) $('offline').hidden = true; else setLive.t = setTimeout(() => { if (!S.live) $('offline').hidden = false; }, 4000);
}
function refreshAll() { scheduleChats(0); reloadTail().catch(() => {}); checkNumbers(); if (S.panel) refreshPanel(); }
function closeLive() { for (const k of Object.keys(streams)) { try { streams[k].close(); } catch {} delete streams[k]; } }
function live() {
  closeLive();
  const es = new EventSource('/api/stream' + (S.nf ? '?number=' + encodeURIComponent(S.nf) : '')); streams.es = es;
  const on = (src, ev, fn) => src.addEventListener(ev, (e) => { try { fn(JSON.parse(e.data)); } catch (err) { console.error('live', ev, err); } });
  on(es, 'message.created', (m) => {
    const c = S.chats.find((x) => x.jid === m.chat_jid);
    if (!c) { scheduleChats(); return; }
    Object.assign(c, { last_ts: m.timestamp, last_text: m.text, last_type: m.type, last_from_me: m.from_me, last_sender: m.sender_name, last_deleted: false, last_uid: m.uid });
    if (c.stub) { c.stub = false; scheduleChats(); }
    if (m.from_me) c.waiting_since = null; else c.waiting_since = c.waiting_since || m.timestamp;
    const open = S.cur && S.cur.jid === m.chat_jid, seen = open && document.visibilityState === 'visible';
    if (!m.from_me && !seen) { c.unread = (c.unread || 0) + 1; notify(c, m); }
    if (open && !S.searching) merge([m]);
    renderTabs(); renderChats(); if (open) markRead();
  });
  const upd = (m) => { if (S.cur && m.chat_jid === S.cur.jid && !S.searching) merge([m]); };
  on(es, 'message.updated', upd); on(es, 'message.deleted', upd);
  on(es, 'reaction', (d) => { if (S.cur && (d.chat_jid === S.cur.jid || !d.chat_jid)) setTimeout(() => reloadTail().catch(() => {}), 300); });
  on(es, 'group.updated', () => { scheduleChats(); if (S.panel && S.panelTab === 'info') { clearTimeout(infoTimer); infoTimer = setTimeout(() => loadInfo().catch(() => {}), 500); } });
  on(es, 'connection', () => checkNumbers());
  let first = true;
  es.onopen = () => { setLive(true); if (!first) refreshAll(); first = false; };
  es.onerror = () => setLive(false);

  const ts = new EventSource('/portal/chat/stream'); streams.ts = ts;
  on(ts, 'chat.state', applyState);
  on(ts, 'chat.sent', (d) => { const m = S.msgs.find((x) => x.uid === d.uid); if (m) { m.sent_by_name = d.sent_by_name; renderMsgs('keep'); } });
  on(ts, 'note.created', (n) => { if (S.cur && n.chat_jid === S.cur.jid) { S.notes.push(n); if (S.panel && S.panelTab === 'notes') renderNotes(); } });
  on(ts, 'note.deleted', (d) => { S.notes = S.notes.filter((n) => n.id !== d.id); if (S.panel && S.panelTab === 'notes') renderNotes(); });
  on(ts, 'quick.changed', () => loadQuick().catch(() => {}));
}
// Browsers give up on a stream after a proxy error or a deploy; this brings it back, and catches up on what was missed.
function ensureLive() { const dead = !streams.es || !streams.ts || streams.es.readyState === 2 || streams.ts.readyState === 2; if (dead) { live(); refreshAll(); } }

// ---------- header, numbers, stats
async function checkNumbers() {
  try { S.numbers = (await api('/api/numbers')).numbers; } catch { return; }
  const off = S.numbers.filter((n) => n.state !== 'open'), b = $('banner');
  b.hidden = !off.length;
  if (off.length) { b.textContent = ''; b.append(document.createTextNode((off.length === 1 ? 'Number "' + off[0].label + '" is' : off.length + ' numbers are') + ' offline, so messages to ' + (off.length === 1 ? 'it' : 'them') + ' are not being received. ')); if (S.me.role === 'admin') { const a = h('a', '', 'Open the portal to reconnect'); a.href = '/'; b.append(a); } else b.append(document.createTextNode('Tell an admin.')); }
  const nf = $('nfilter'); nf.hidden = S.numbers.length < 2;
  if (nf.options.length !== S.numbers.length + 1) { nf.replaceChildren(new Option('All numbers', ''), ...S.numbers.map((n) => new Option(n.label, String(n.id)))); nf.value = S.nf; }
  if (S.cur) fillSendAs();
}
$('meBtn').onclick = (e) => {
  e.preventDefault();
  modal(S.me.name + ' (' + S.me.role + ')', (c) => {
    const row = (label, fn) => { const b = h('button', '', label); b.style.cssText = 'display:block;width:100%;margin-top:8px;text-align:left'; b.onclick = fn; c.append(b); return b; };
    row('Team response times', showStats);
    const al = row(alertsOn() ? 'Desktop alerts: on (click to turn off)' : 'Turn on desktop alerts and sound', async () => {
      if (alertsOn()) { lsSet('alerts', '0'); al.textContent = 'Desktop alerts: off'; return; }
      if (!('Notification' in window)) { toast('This browser does not support desktop alerts.'); return; }
      const p = await Notification.requestPermission(); if (p === 'granted') { lsSet('alerts', '1'); al.textContent = 'Desktop alerts: on (click to turn off)'; beep(); } else toast('Allow notifications for this site in the browser first.');
    });
    if (S.me.id) row('Change my password', () => {
      const o = prompt('Current password'); if (!o) return; const n = prompt('New password (at least 8 characters)'); if (!n) return;
      api('/portal/password', { method: 'POST', body: { old: o, new: n } }).then(() => toast('Password changed.')).catch((er) => toast(er.message));
    });
    row('Sign out', async () => { await fetch('/portal/logout', { method: 'POST' }); location.href = '/'; });
  });
};
async function showStats() {
  const st = await api('/portal/chat/stats?days=7');
  modal('Last 7 days', (c) => {
    const s = h('div', 'stat'); [['Waiting for a reply', st.waiting], ['Longest wait', mins(st.oldest_waiting_minutes)], ['Average first reply', mins(st.avg_response_minutes)], ['Typical (median)', mins(st.median_response_minutes)]]
      .forEach(([k, v]) => { const d = h('div'); d.append(h('b', '', String(v)), h('span', 'sub', k)); s.append(d); }); c.append(s);
    const t = h('table', 't'); const hr = h('tr'); ['Person', 'Replies', 'Avg first reply'].forEach((x) => hr.append(h('th', '', x))); t.append(hr);
    st.by_person.forEach((p) => { const r = h('tr'); r.append(h('td', '', p.name), h('td', '', String(p.replies)), h('td', '', mins(p.avg_response_minutes))); t.append(r); }); c.append(t);
    c.append(h('p', 'sub', 'First reply = time from a customer message to our next message in that chat.'));
  });
}

// ---------- wiring
$('gsearch').oninput = () => { S.q = $('gsearch').value.trim(); renderChats(); };
$('sfilter').onchange = () => { S.status = $('sfilter').value; renderChats(); };
$('kfilter').onchange = () => { S.kind = $('kfilter').value; lsSet('kind', S.kind); renderChats(); };
$('nfilter').onchange = async () => { S.nf = $('nfilter').value; live(); await loadChats().catch((e) => toast(e.message)); if (S.cur) openChat(S.cur.jid); };
$('status').onchange = () => saveState({ status: $('status').value });
$('assignee').onchange = () => saveState({ assignee_id: $('assignee').value ? Number($('assignee').value) : null });
$('back').onclick = () => { saveDraft(); $('app').classList.remove('chat'); };
$('msearch').addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter' || !S.cur) return; const v = $('msearch').value.trim(), tok = S.openTok;
  if (!v) { S.searching = false; return openChat(S.cur.jid); }
  try { const j = await api(mUrl(S.cur.jid, `limit=200&search=${encodeURIComponent(v)}`)); if (tok !== S.openTok) return; S.searching = true; S.hasMore = false; S.msgs = j.messages.reverse(); renderMsgs('bottom'); }
  catch (er) { toast(er.message); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { ensureLive(); scheduleChats(0); reloadTail().catch(() => {}); markRead(); } });
window.addEventListener('online', () => { ensureLive(); refreshAll(); });
window.addEventListener('offline', () => setLive(false));
setInterval(() => { if (document.visibilityState === 'visible') ensureLive(); }, 15000);
setInterval(checkNumbers, 30000);
setInterval(() => { if (document.visibilityState === 'visible' && !S.live) scheduleChats(0); }, 45000);   // safety net while the live stream is down
setInterval(() => { if (document.visibilityState === 'visible') renderChats(); }, 60000);                   // refresh "waiting" timers

(async () => {
  const me = await api('/portal/chat/me'); S.me = me.user; S.writes = me.writes_enabled;
  $('meBtn').textContent = S.me.name; $('navPortal').hidden = S.me.role !== 'admin';
  S.kind = ['all', 'group', 'dm'].includes(lsGet('kind')) ? lsGet('kind') : 'all'; $('kfilter').value = S.kind;
  if (!S.writes) { $('composer').remove(); $('newbtns').remove(); }
  await Promise.all([checkNumbers(), api('/portal/chat/users').then((j) => { S.users = j.users; }), loadQuick().catch(() => {})]);
  await loadChats(); live();
})().catch((e) => { $('msgs').replaceChildren(h('div', 'empty', 'Could not load: ' + e.message)); });
</script>
