<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexalog WhatsApp Listener</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hexalog.css">
<style>
  main { max-width:560px; margin:-28px auto 0; padding:0 16px 64px; position:relative; }
  .status { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.s-open { background:var(--ok); box-shadow:0 0 0 4px rgba(22,138,82,.18); } .dot.s-qr,.dot.s-pairing,.dot.s-connecting,.dot.s-reconnecting { background:var(--warn); } .dot.s-logged_out,.dot.s-replaced { background:var(--danger); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .qrimg { display:block; margin:16px auto 4px; width:260px; height:260px; border-radius:16px; background:#fff; padding:10px; border:1.5px solid var(--line); }
  .code { font:800 32px/1.2 var(--mono); letter-spacing:.12em; text-align:center; margin:16px 0 4px; color:var(--accent); }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:8px; }
  .num h3 { margin:0; font-size:18px; } .num .head { display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .num input.ph { margin-top:12px; }
  ol { padding-left:20px; margin:8px 0 0; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><a class="logo" href="/"><img src="/hexalog-logo.webp" alt="Hexalog" onerror="this.remove()"><span class="wm">HEXALOG</span></a>
  <nav><a class="on" href="/">Portal</a><a href="/docs">API docs</a></nav></div></header>
<section class="hero"><div class="hero-in">
  <span class="pill">CX WhatsApp listener</span>
  <h1>Your numbers. <mark>Every CX group.</mark></h1>
  <p>Link each CX number once. After that it listens to every group it has been added to, and your systems read them all through one API.</p>
</div></section>
<main>

  <!-- Login -->
  <section id="login" class="card" hidden>
    <label for="pw">Portal password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <div class="row"><button id="loginBtn" class="primary">Sign in</button></div>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- Dashboard -->
  <section id="dash" hidden>
    <div id="numbers"></div>
    <div class="card" id="addCard">
      <label for="newLabel">Add another WhatsApp number</label>
      <input id="newLabel" placeholder="Name, e.g. Delhi CX or Support 2" maxlength="60">
      <div class="row"><button id="addBtn" class="primary">Add number</button><span class="muted" id="maxText" style="align-self:center"></span></div>
      <div class="err" id="addErr"></div>
    </div>
    <div class="card muted" id="statsCard" hidden></div>
    <div class="row" style="justify-content:space-between"><span class="muted" id="modeText"></span><span><a href="/docs" class="muted">API docs</a> &nbsp; <button id="logoutBtn">Sign out</button></span></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const LABEL = { idle:'Not connected', connecting:'Connecting…', qr:'Waiting for QR scan', pairing:'Waiting for pairing code entry', open:'Connected and listening', reconnecting:'Reconnecting…', logged_out:'Unlinked — link again', replaced:'Number is connected somewhere else' };
let es = null, lastKey = '';
const phoneDraft = {};   // id -> text typed in the pairing-phone box, kept across live updates

async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: opts.body ? { 'content-type':'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/portal/login') { showLogin(); throw new Error('login required'); }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function showLogin() { if (es) es.close(); $('login').hidden = false; $('dash').hidden = true; }
function showDash() { $('login').hidden = true; $('dash').hidden = false; listen(); }
function listen() { if (es) es.close(); es = new EventSource('/portal/events'); es.onmessage = (e) => render(JSON.parse(e.data)); }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function btn(text, cls, errBox, fn) {
  const b = el('button', cls, text);
  b.onclick = async () => { errBox.textContent = ''; b.disabled = true; try { await fn(); } catch (e) { errBox.textContent = e.message; } b.disabled = false; };
  return b;
}

function card(n) {
  const c = el('div', 'card num'); c.dataset.id = n.id;
  const err = el('div', 'err');
  const head = el('div', 'head');
  const left = el('div');
  const st = el('div', 'status'); st.append(el('span', 'dot s-' + n.state), el('span', '', LABEL[n.state] || n.state));
  left.append(el('h3', '', n.label), st);
  head.append(left, el('span', 'muted', 'ID ' + n.id));
  c.append(head);
  const who = n.me ? 'Linked as ' + n.me.jid.split(':')[0].split('@')[0] + (n.me.name ? ' (' + n.me.name + ')' : '') : (n.phone ? 'Number ' + n.phone : '');
  if (who) c.append(el('div', 'muted', who));
  if (n.state !== 'open' && n.last_error) c.append(el('div', 'muted', n.last_error));
  if (n.qr) {
    const img = el('img', 'qrimg'); img.alt = 'WhatsApp QR code'; img.src = n.qr; c.append(img);
    const ol = el('ol'); ['Open WhatsApp on the phone that has this number', 'Settings → Linked devices → Link a device', 'Scan this code (it refreshes every ~20 seconds)'].forEach((t) => ol.append(el('li', '', t))); c.append(ol);
  }
  if (n.pairing_code) {
    c.append(el('div', 'code', n.pairing_code));
    const ol = el('ol'); ['On the phone: Settings → Linked devices → Link a device', 'Tap “Link with phone number instead”', 'Enter the code above'].forEach((t) => ol.append(el('li', '', t))); c.append(ol);
  }
  const row = el('div', 'row');
  if (n.state === 'open') {
    row.append(btn('Pause listening', '', err, () => api(`/portal/numbers/${n.id}/disconnect`, { method:'POST' })));
    row.append(btn('Unlink', 'danger', err, async () => { if (confirm(`Unlink "${n.label}"? You will need to scan again.`)) await api(`/portal/numbers/${n.id}/unlink`, { method:'POST' }); }));
  } else if (['idle', 'logged_out', 'replaced'].includes(n.state)) {
    row.append(btn('Link with QR code', 'primary', err, () => api(`/portal/numbers/${n.id}/connect`, { method:'POST', body:{} })));
  } else {
    row.append(btn('Cancel', '', err, () => api(`/portal/numbers/${n.id}/disconnect`, { method:'POST' })));
  }
  row.append(btn('Rename', '', err, async () => { const v = prompt('Name for this number', n.label); if (v && v.trim()) await api(`/portal/numbers/${n.id}`, { method:'PUT', body:{ label: v.trim() } }); }));
  if (n.state !== 'open') row.append(btn('Delete', 'danger', err, async () => {
    if (confirm(`Delete "${n.label}"? Its saved messages stay, but the number is removed from this list.`)) await api(`/portal/numbers/${n.id}`, { method:'DELETE' }); }));
  c.append(row);
  if (n.state !== 'open') {
    const ph = el('input', 'ph'); ph.inputMode = 'numeric'; ph.placeholder = 'Or link by pairing code: phone with country code, e.g. 919311855419';
    ph.value = phoneDraft[n.id] || ''; ph.oninput = () => { phoneDraft[n.id] = ph.value; };
    const r2 = el('div', 'row'); r2.append(btn('Get pairing code', '', err, () => api(`/portal/numbers/${n.id}/connect`, { method:'POST', body:{ phone: ph.value } })));
    c.append(ph, r2);
  }
  c.append(err);
  return c;
}

function render(data) {
  const nums = data.numbers || [];
  const box = $('numbers');
  const typing = box.contains(document.activeElement) && document.activeElement.tagName === 'INPUT';
  const key = JSON.stringify(nums);
  if (!(typing && key === lastKey)) { lastKey = key; const keep = typing ? document.activeElement.parentElement.dataset.id : null; box.replaceChildren(...nums.map(card)); if (keep) box.querySelector(`[data-id="${keep}"] input`)?.focus(); }
  $('maxText').textContent = nums.length + ' of ' + data.max + ' numbers';
  $('addCard').hidden = nums.length >= data.max;
  const open = nums.filter((n) => n.state === 'open').length;
  $('modeText').textContent = open + ' of ' + nums.length + ' connected. ' + (nums[0]?.writes_enabled ? 'Sending and group management are enabled for the admin API key.' : 'Listen-only: sending is disabled.');
  loadStats(open > 0);
}

async function loadStats(open) {
  const c = $('statsCard'); if (!open) { c.hidden = true; return; }
  try { const g = await api('/api/groups'); const msgs = g.groups.reduce((n, x) => n + x.message_count, 0);
    c.hidden = false; c.textContent = g.count + ' groups visible · ' + msgs + ' messages stored'; } catch { c.hidden = true; }
}

$('addBtn').onclick = async () => {
  $('addErr').textContent = '';
  try { await api('/portal/numbers', { method:'POST', body:{ label: $('newLabel').value.trim() } }); $('newLabel').value = ''; }
  catch (e) { $('addErr').textContent = e.message; }
};
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await api('/portal/login', { method:'POST', body:{ password: $('pw').value } }); $('pw').value=''; showDash(); }
  catch (e) { $('loginErr').textContent = e.message; }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').onclick = async () => { await api('/portal/logout', { method:'POST' }).catch(()=>{}); showLogin(); };

api('/portal/me').then(showDash).catch(showLogin);
</script>
</body>
</html>
